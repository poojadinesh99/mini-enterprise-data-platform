name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: pip install -r ingestion/requirements.txt pytest

      - name: Install Spark/Delta dependencies
        run: pip install -r spark/requirements-spark.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check ingestion spark

      - name: Run unit tests
        run: pytest -q
        continue-on-error: false

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, validate only)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  gold-layer-smoke-test:
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Spark/Delta dependencies
        run: pip install -r spark/requirements-spark.txt

      - name: Run local Bronze -> Silver -> Gold pipeline
        working-directory: spark
        env:
          DELTA_ROOT: ${{ github.workspace }}/spark/data/delta
        run: |
          python ingest_bronze.py
          python transform_silver.py
          python build_gold_star_schema.py
